<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Docs</title>
<link rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0; width: 100vw; height: 100vh;
    background: #000; overflow: hidden; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body > canvas {
    position: fixed !important; inset: 0 !important;
    display: block !important; width: 100vw !important; height: 100vh !important;
    outline: none; background: #000;
  }
  #status {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #ddd;
    font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 20px;
    pointer-events: none; white-space: pre-line; z-index: 100;
    background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #status:empty { display: none; }
  #status-title {
    font-family: 'Audiowide', sans-serif; font-size: 28px; letter-spacing: 2px;
    color: #ff9900; text-shadow: 0 0 12px rgba(255, 153, 0, 0.5); margin-bottom: 10px;
  }
  #status-desc { color: #c7c1d2; font-family: monospace; font-size: 14px; max-width: 600px; }
  #top-bar { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 999999; }
  .hud-btn {
    background-color: #111; color: #fff; border: 2px solid #ff9900;
    font-size: 11px; font-family: 'Audiowide', sans-serif; padding: 7px 14px;
    cursor: pointer; border-radius: 6px; letter-spacing: 1px;
    box-shadow: 0 0 8px rgba(255, 153, 0, 0.4); transition: all 0.3s ease; user-select: none;
  }
  .hud-btn:hover, .fireInside {
    background-image: linear-gradient(270deg, red, orange, yellow) !important;
    background-size: 300% 300% !important; animation: fireInside 3s linear infinite !important;
    color: #fff !important; text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
    box-shadow: inset 0 0 10px rgba(255, 165, 0, 0.4), 0 0 14px #ff9900 !important;
    border-color: #ff9900 !important;
  }
  @keyframes fireInside {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</style>
</head>
<body>
<div id="top-bar">
  <button id="btn-ab" class="hud-btn" onclick="openAboutBlank(this)" onmouseover="this.classList.add('fireInside')" onmouseout="this.classList.remove('fireInside')">about:blank</button>
  <button id="btn-fs" class="hud-btn" onclick="toggleFullscreen()" onmouseover="this.classList.add('fireInside')" onmouseout="this.classList.remove('fireInside')">Fullscreen</button>
</div>

<div id="status">
  <div id="status-title">HORIZON</div>
  <div id="status-desc">Starting…</div>
</div>

<script>
var audioCtxs = [];
var OrigAudioContext = window.AudioContext || window.webkitAudioContext;
if (OrigAudioContext) {
  var PatchedAudioContext = function (opts) {
    var ctx = new OrigAudioContext(opts);
    audioCtxs.push(ctx);
    return ctx;
  };
  PatchedAudioContext.prototype = OrigAudioContext.prototype;
  window.AudioContext = PatchedAudioContext;
  if (window.webkitAudioContext) window.webkitAudioContext = PatchedAudioContext;

  function resumeAllAudio() {
    audioCtxs.forEach(function (c) {
      if (c && c.state === "suspended") c.resume().catch(function () {});
    });
  }
  window.addEventListener("pointerdown", resumeAllAudio, { passive: true });
  window.addEventListener("keydown", resumeAllAudio, { passive: true });
}

const origPointerLock = Element.prototype.requestPointerLock || function () {};
Element.prototype.requestPointerLock = function () {
  try {
    const res = origPointerLock.apply(this, arguments);
    if (res && typeof res.catch === "function") res.catch(() => {});
    return res;
  } catch (e) {}
};

var ORIGINAL_TEXT = "about:blank";
var POPUP_TEXT = "Allow Popups!";
function setTemp(text, ms) {
  var btn = document.getElementById("btn-ab");
  if (!btn) return;
  btn.innerText = text;
  btn.classList.add("fireInside");
  setTimeout(function () {
    btn.innerText = ORIGINAL_TEXT;
    btn.classList.remove("fireInside");
  }, ms || 3500);
}

function openAboutBlank(btn) {
  try {
    var win = window.open("about:blank", "_blank");
    if (!win || win.closed) {
      setTemp(POPUP_TEXT, 4500);
      return;
    }
    var docClone = document.documentElement.cloneNode(true);
    var topBar = docClone.querySelector("#top-bar");
    if (topBar) topBar.remove();

    var doc = win.document;
    doc.open();
    doc.write("<!doctype html>\n" + docClone.outerHTML);
    doc.close();

    var checkReady = setInterval(function () {
      try {
        if (win.document && win.document.head) {
          win.document.title = "Google Docs";
          var link = win.document.querySelector("link[rel*='icon']");
          if (!link) {
            link = win.document.createElement("link");
            link.rel = "icon";
            win.document.head.appendChild(link);
          }
          link.href = "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico";
          clearInterval(checkReady);
        }
      } catch (err) {
        clearInterval(checkReady);
      }
    }, 50);
  } catch (e) {
    setTemp(POPUP_TEXT, 4500);
  }
}

function toggleFullscreen() {
  var canvas = document.querySelector("canvas") || document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (canvas.requestFullscreen || canvas.webkitRequestFullscreen).call(canvas);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
  if (canvas) canvas.focus();
}
</script>

<script type="module" src="main.js"></script>
</body>
</html>
